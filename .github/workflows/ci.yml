name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The name is what the main branch ruleset requires as a status check, so it
  # is not free to change with what the job happens to run.
  test:
    runs-on: ubuntu-latest

    steps:
      # The fixtures live at the repo root and the harness finds them by walking
      # up from the test binary, so the whole tree has to be checked out.
      - uses: actions/checkout@v4

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true
          opam-pin: false

      - name: Install dependencies
        working-directory: bootstrap2
        run: opam install . --deps-only --with-test --yes

      - name: Build
        working-directory: bootstrap2
        run: opam exec -- dune build

      - name: Test
        working-directory: bootstrap2
        run: opam exec -- dune test
